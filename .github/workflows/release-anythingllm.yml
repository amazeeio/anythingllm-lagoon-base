name: Release AnythingLLM

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-anythingllm
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record starting commit
        id: before_release
        run: |
          git fetch --force --tags origin
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Release latest AnythingLLM version if needed
        run: ./scripts/release-anythingllm.sh --push

      - name: Detect release result
        id: release_state
        run: |
          current_sha=$(git rev-parse HEAD)

          if [ "$current_sha" = "${{ steps.before_release.outputs.sha }}" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(perl -ne 'print "$1\n" if /^ARG ANYTHINGLLM_VERSION=(.+)$/ ' Dockerfile | head -n 1)

          if [ -z "$version" ]; then
            echo "error: could not determine ANYTHINGLLM_VERSION after release" >&2
            exit 1
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.release_state.outputs.released == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.release_state.outputs.released == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.release_state.outputs.released == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=raw,value=v${{ steps.release_state.outputs.version }}
          labels: |
            org.opencontainers.image.title=anythingllm-lagoon-base
            org.opencontainers.image.description=Base AnythingLLM Lagoon runtime image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        if: steps.release_state.outputs.released == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
